# ==============================================================================
# 1. Proxmox VE 9.1 Host Network Configuration (/etc/network/interfaces)
# Host Hardware: Intel Core i5-7400T (4C/4T), 15.5 GiB RAM, Single Physical NIC
# ==============================================================================

auto lo
iface lo inet loopback

iface nic0 inet manual

# Single VLAN-aware Linux bridge carrying WAN (VLAN 2) and all LAN VLANs (10,20,30,40,50,99)
auto vmbr0
iface vmbr0 inet manual
        bridge-ports nic0
        bridge-stp off
        bridge-fd 0
        bridge-vlan-aware yes
        bridge-vids 2-4094

# Proxmox Host Management Interface on VLAN 99
auto vmbr0.99
iface vmbr0.99 inet static
        address 192.168.99.3/24
        gateway 192.168.99.1


# ==============================================================================
# 2. Proxmox VM 104 Configuration (/etc/pve/qemu-server/104.conf)
# Firewall: pfSense CE 2.8.1
# ==============================================================================

# --- AFTER MIGRATION (VirtIO + 4 vCPUs / 4 GiB RAM) ---
bios: seabios
boot: order=scsi0
cores: 4
cpu: host
machine: q35
memory: 4096
name: pfSense
net0: virtio=BC:24:11:8C:64:78,bridge=vmbr0,tag=2
net1: virtio=BC:24:11:48:B9:91,bridge=vmbr0
onboot: 1
ostype: other
scsi0: Storage:104/vm-104-disk-0.qcow2,iothread=1,size=32G
scsihw: virtio-scsi-single
sockets: 1
vga: qxl

# --- BEFORE MIGRATION (Intel E1000) ---
# cores: 1 (later upgraded to 4)
# memory: 2048 (later upgraded to 4096)
# net0: e1000=BC:24:11:8C:64:78,bridge=vmbr0,tag=2
# net1: e1000=BC:24:11:48:B9:91,bridge=vmbr0
